[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/MinecraftIndustrialComplex/mic-rtsim"

[workspace.dependencies]
rtsim-kernel = { path = "crates/rtsim-kernel" }
rtsim-industry = { path = "crates/rtsim-industry" }
# Phase 1 generic modules (PLAN.md §5.1, §8) and their composition.
rtsim-settle = { path = "crates/rtsim-settle" }
rtsim-trade = { path = "crates/rtsim-trade" }
rtsim-travel = { path = "crates/rtsim-travel" }
rtsim-knowledge = { path = "crates/rtsim-knowledge" }
rtsim-world = { path = "crates/rtsim-world" }
# Phase 2: hunger, prey and dragons (PLAN.md §1.2, §9).
rtsim-ecology = { path = "crates/rtsim-ecology" }
# Ships, pirates and navies (PLAN.md §10.1).
rtsim-ships = { path = "crates/rtsim-ships" }
# The world model: the provider trait and the vanilla habitat sampler's cells (PLAN.md §5.1).
rtsim-space = { path = "crates/rtsim-space" }
# Conflict: factions, grievance, war bands and raids (PLAN.md §10.3).
rtsim-conflict = { path = "crates/rtsim-conflict" }
# The event archive: rows, tapes, chunks and tiers (VIEWER.md §10).
rtsim-archive = { path = "crates/rtsim-archive" }
# The save viewer: a saved world read only, served to the shared viewer page (VIEWER.md).
rtsim-view = { path = "crates/rtsim-view" }
# The viewer's part format and the layers every source draws (VIEWER.md §4.3, V4): reachable by the
# engine without the viewer's server.
rtsim-parts = { path = "crates/rtsim-parts" }
rtsim-layers = { path = "crates/rtsim-layers" }
# Deep Time's world-data format: its layout block (`projection::ProjectionSpec`, FORMAT.md "The
# world's layout") is linked, not mirrored (docs/choices-topology.md TP10). Private, pinned like
# mic-native; Deep Time master 3bf532d1. LGPL-3.0-or-later.
deeptime-format = { git = "ssh://git@github.com/MinecraftIndustrialComplex/deep-time.git", rev = "3bf532d1383f578ccb81b90b42a8bd383d9ae61c" }
# The page codec, matching Deep Time's tile packs (crates/deeptime-format). MIT.
lz4_flex = "0.14.0"
# MIT OR Apache-2.0.
crc32fast = "1.5.2"
# Manifests and bench results. MIT OR Apache-2.0.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Property tests (SCALE.md §2 invariants, §4 composition rule). MIT OR Apache-2.0.
proptest = "1"
# The glass box's LP upper bound (GLASSBOX.md §3.5, G-B15; choice GB12). Apache-2.0, pure Rust.
microlp = { version = "=0.6.0", default-features = false }
# The native host's plugin runtime and, for rtsim-jni's tests, the host itself (in process), from
# the private repository MinecraftIndustrialComplex/mic-native at a pinned commit (choice J1). MPL-2.0.
mic-native-rt = { git = "ssh://git@github.com/MinecraftIndustrialComplex/mic-native.git", rev = "63add99806268bdc77b53e72adc807cc5d0f9f67", default-features = false }
mic-native-host = { git = "ssh://git@github.com/MinecraftIndustrialComplex/mic-native.git", rev = "63add99806268bdc77b53e72adc807cc5d0f9f67", default-features = false }
# The shared world viewer (VIEWER.md, VW1): its HTTP server, viewer API, scenes, tile cache and page,
# from the public repository MinecraftIndustrialComplex/mic-viewer at a pinned commit, as mic-native
# is pinned. MPL-2.0. Only rtsim-view, rtsim-host and rtsim-cli use them.
mic-viewer = { git = "ssh://git@github.com/MinecraftIndustrialComplex/mic-viewer.git", rev = "335ae9cf23d2b35ef34fb265d50de0d8788f3c07" }
# Surveyor's terrain summaries as a base map (VIEWER.md §9, V5), from the same repository and commit.
mic-viewer-surveyor = { git = "ssh://git@github.com/MinecraftIndustrialComplex/mic-viewer.git", rev = "335ae9cf23d2b35ef34fb265d50de0d8788f3c07" }
# Create's rail (create_tracks.dat) and its factory block entities read from a save, drawn as the
# viewer's rail, factory and logistics layers, from the same repository and commit.
mic-viewer-create = { git = "ssh://git@github.com/MinecraftIndustrialComplex/mic-viewer.git", rev = "335ae9cf23d2b35ef34fb265d50de0d8788f3c07" }
# Gzip for Minecraft's NBT files (the Java journal, level.dat; the viewer reads the journal's
# dimension names). Already in the tree through mic-viewer's png. MIT OR Apache-2.0.
flate2 = "1.1"
# The JNI binding, pinned as mic-native and Deep Time pin it. Only rtsim-jni uses it. MIT OR Apache-2.0.
jni = "=0.22.4"

[profile.release]
# Keep unwinding: the JNI crate (later) catches panics at every export (PLAN.md §2).
panic = "unwind"
lto = "thin"
debug = "line-tables-only"

[profile.ship]
# What ships: release plus fat LTO in one codegen unit, as mic_native's and Deep Time's natives
# (tools/natives/build-natives.sh). Everyday builds stay on `release`.
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false

[profile.dev]
# As Deep Time: the kernel's own crates at -O1 so property tests finish, with debug assertions and
# overflow checks still on. Line tables only, as release: panics and backtraces keep file and line,
# and the debug info that was most of each worktree's target/ goes.
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
