[package]
name = "rtsim-jni"
description = "mic-rtsim's native link: a mic_native plugin that owns the boundary buffers, runs the engine step on the host's background pool and writes pages on its IO lane (docs/boundary.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "rtsim_jni"
# cdylib: the plugin library mic_native loads and Java binds; rlib: the tests link it in process.
crate-type = ["cdylib", "rlib"]

[dependencies]
rtsim-kernel.workspace = true
rtsim-industry.workspace = true
# Phase 1 (docs/boundary.md §4): the world and the modules whose types it speaks.
rtsim-world.workspace = true
rtsim-settle.workspace = true
rtsim-trade.workspace = true
rtsim-travel.workspace = true
rtsim-knowledge.workspace = true
# Phase 2's dragons (docs/boundary.md §6).
rtsim-ecology.workspace = true
# Ships, pirates and navies (docs/boundary.md §7).
rtsim-ships.workspace = true
# Factions, grievance and war bands (docs/boundary.md §9).
rtsim-conflict.workspace = true
# The world model (docs/boundary.md §10).
rtsim-space.workspace = true
mic-native-rt.workspace = true
jni.workspace = true

[dev-dependencies]
# Property tests: the phase 1 world restored at any point of an input script (S6).
proptest.workspace = true
# The host, started in the test process: the protocol test runs steps on its real pools.
mic-native-host.workspace = true
# The fake Java side the tests drive the engine with, shared with the headless host.
rtsim-host = { path = "../rtsim-host" }
