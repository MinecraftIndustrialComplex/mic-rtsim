[package]
name = "rtsim-cli"
description = "mic-rtsim's command line: the scale bench now; run, replay and inspect later (PLAN.md §4.11)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "rtsim-cli"
path = "src/main.rs"

[dependencies]
rtsim-kernel.workspace = true
rtsim-industry.workspace = true
rtsim-trade.workspace = true
rtsim-settle.workspace = true
rtsim-travel.workspace = true
rtsim-knowledge.workspace = true
rtsim-world.workspace = true
rtsim-ecology.workspace = true
rtsim-ships.workspace = true
rtsim-conflict.workspace = true
# The headless host: `run` and `export` (VIEWER.md §12).
rtsim-host = { path = "../rtsim-host" }
# The heap gauge of the allocator mic_native's runtime installs (rtsim-jni, through rtsim-host).
mic-native-rt.workspace = true
serde.workspace = true
serde_json.workspace = true
# State hashes over pages. MIT OR Apache-2.0.
crc32fast.workspace = true
# Thread CPU time (clock_gettime) for the bench. MIT OR Apache-2.0.
libc = "0.2"
