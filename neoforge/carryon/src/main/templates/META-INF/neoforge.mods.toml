modLoader     = "javafml"
loaderVersion = "${loader_version_range}"
license       = "${mod_license}"

[[mods]]
modId       = "${mod_id}"
version     = "${mod_version}"
displayName = "${mod_name}"
authors     = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId        = "minecraft"
    type         = "required"
    versionRange = "${minecraft_version_range}"
    ordering     = "NONE"
    side         = "BOTH"

[[dependencies.${mod_id}]]
    modId        = "neoforge"
    type         = "required"
    versionRange = "${neo_version_range}"
    ordering     = "NONE"
    side         = "BOTH"

[[dependencies.${mod_id}]]
    modId        = "mic_rtsim"
    type         = "required"
    versionRange = "[0.1.0,)"
    ordering     = "AFTER"
    side         = "BOTH"

# The plugin is built around one mod (D4); verified against Carry On 2.2.6.13. 2.2.2.11 (TBSMP's pack)
# has the same EntityPickupEvent (player, target) and ran with the plugin in the TBSMP stress run.
[[dependencies.${mod_id}]]
    modId        = "carryon"
    type         = "required"
    versionRange = "${carryon_version_range}"
    ordering     = "AFTER"
    side         = "BOTH"
