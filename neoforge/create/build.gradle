plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

// mic_rtsim_create (A1, A19): the Create plugin of the industry workstream (INDUSTRY.md §12, layer 2).
// Its own jar and mod id. It compiles against the core and against the pack's Create 6.0.10 jar, which it
// never bundles. Create's own libraries (Ponder with catnip, Flywheel, Registrate) are jar-in-jar inside
// that jar, so the compile classpath gets copies extracted from it; the GameTest server loads the full
// Create jar, whose jar-in-jar FML unpacks itself.
evaluationDependsOn(':core')
// -PwithMowzie (docs/choices-mowzie-build.md MZB-329): the GameTest server loads mic_rtsim_mowziesmobs and Mowzie's
// Mobs too, for the Frostmaw test of the train sampler (M7). Without it the project needs no Mowzie jar: its tests
// name Mowzie only by registry id and NBT, and the Frostmaw test is registered only where the mod is loaded.
def withMowzie = project.hasProperty('withMowzie')
if (withMowzie)
    evaluationDependsOn(':mowziesmobs')

version = mod_version
group   = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

def packMods = rootProject.file(project.findProperty('packMods') ?: project.create_packMods).absolutePath
def createJar = file("${packMods}/${create_jar}")

// Create's jar-in-jar libraries, for compiling only (never on a runtime classpath: the full Create jar
// carries them, and two copies of a mod id is a hard FML failure).
def createLibsDir = layout.buildDirectory.dir('create-jarjar')
// Sync, not Copy: a build against another Create jar must not keep the old one's libraries
def extractCreateLibs = tasks.register('extractCreateLibs', Sync) {
    description = 'Extracts Ponder (catnip), Flywheel and Registrate from the Create jar, for compiling.'
    from(zipTree(createJar)) {
        include 'META-INF/jarjar/*.jar'
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
    into createLibsDir
}
def createLibs = files({ fileTree(createLibsDir.get().asFile).matching { include '*.jar' }.files }) { builtBy extractCreateLibs }

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        // `./gradlew :create:runGameTestServer`: the core, this plugin and Create 6.0.10 on a headless
        // dedicated server, running every @GameTest in this plugin's namespace against the session's
        // engine (the industry tests script the engine side on either). mic_rtsim_create.mixins.json is
        // defaultRequire 1, so a Create mixin that no longer matches fails the launch.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'mic_rtsim.gametest', 'true'
            // The session's engine, as the core's run: native (rtsim-jni, with the industry engine behind it)
            // unless -PrtsimEngine=stub. The industry commands the tests script go to the native engine as
            // INDUSTRY_COMMAND orders (choice W17; before it, H25 pinned this run to the stub).
            systemProperty 'mic_rtsim.engine', (project.findProperty('rtsimEngine') ?: 'native').toString()
            jvmArgument '-Xmx4G'
            if (project.hasProperty('gametestDebugLog')) logLevel = org.slf4j.event.Level.DEBUG
            gameDirectory = file('run-gametest')
        }
        // `./gradlew :create:runSamplerBench -PskipJni`: the train sampler's bench (M7, bench/SamplerBench): 200
        // synthetic trains on the far bench's rings (FarTrainBench), 64 rail territories along them, the stub
        // engine, and a GameTest that keeps the server up for the bench's windows (gametest/SamplerBenchGameTests).
        // -PsamplerTrains=<n>, -PsamplerWindows=<n> and -PsamplerTerritories=<n> change its size (windows 0: no end,
        // until the server is stopped).
        samplerBench {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mic_rtsim_samplerbench'
            systemProperty 'mic_rtsim.gametest', 'true'
            systemProperty 'mic_rtsim.engine', 'stub'
            systemProperty 'mic_rtsim.farbench', 'true'
            systemProperty 'mic_rtsim.farbench.trains', (project.findProperty('samplerTrains') ?: '200').toString()
            // One carriage a train: 200 trains of the default four, 38 blocks long, overlap on the two rings (100 a ring,
            // 19 to 31 blocks apart) and Create crashes them all (derailed), so the sampler would skip every one. It reads
            // only a train's first carriage, so its cost does not depend on the count.
            systemProperty 'mic_rtsim.farbench.carriages', (project.findProperty('samplerCarriages') ?: '1').toString()
            systemProperty 'mic_rtsim.farbench.dress', 'false'
            systemProperty 'mic_rtsim.samplerbench', 'true'
            systemProperty 'mic_rtsim.samplerbench.windows', (project.findProperty('samplerWindows') ?: '6').toString()
            systemProperty 'mic_rtsim.samplerbench.territories', (project.findProperty('samplerTerritories') ?: '64').toString()
            jvmArgument '-Xmx4G'
            gameDirectory = file('run-samplerbench')
        }
        // `./gradlew :create:runStressGen -PskipJni`: builds the synthetic stress world (choice SG1,
        // gametest/stress/StressWorldGameTests) into run-stressgen/world and stops. Only the generator's
        // namespace runs; MIC_STRESS_* environment variables size it. tools/stress-worlds/synth.sh wraps it.
        stressGen {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mic_rtsim_stressgen'
            systemProperty 'mic_rtsim.stressgen', 'true'
            systemProperty 'mic_rtsim.gametest', 'true'
            systemProperty 'mic_rtsim.engine', 'stub'
            jvmArgument "-Xmx${project.findProperty('stressXmx') ?: '12G'}"
            gameDirectory = file('run-stressgen')
        }
    }

    mods {
        "mic_rtsim" {
            sourceSet(project(':core').sourceSets.main)
        }
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        if (withMowzie) {
            "mic_rtsim_mowziesmobs" {
                sourceSet(project(':mowziesmobs').sourceSets.main)
            }
        }
    }
}

if (withMowzie) {
    // The GameTest server runs with the pack's Mowzie's Mobs config, as the mowziesmobs project's own run does
    def mowzieConfig = file("${packMods}/${project(':mowziesmobs').property('mowzie_config')}")
    def packMowzieConfig = tasks.register('packMowzieConfig', Copy) {
        description = "Copies the pack's Mowzie's Mobs config into the GameTest server's config folder."
        from mowzieConfig
        into file('run-gametest/config')
        onlyIf { mowzieConfig.isFile() }
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn packMowzieConfig }
}

dependencies {
    implementation project(':core')
    // mic_native, the native host the core requires (the stub engine runs inside it too).
    runtimeOnly project(':core').micNativeFiles
    compileOnly files(createJar)
    compileOnly createLibs
    // The GameTest server loads Create from the same jar (with its jar-in-jar libraries).
    runtimeOnly files(createJar)
    // -PwithMowzie: the Mowzie plugin and, through it, the Mowzie and GeckoLib jars
    if (withMowzie)
        runtimeOnly project(':mowziesmobs')

    // Pure-Java unit tests of the glass box's cycle models (Cycles touches no Minecraft class).
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        create_version_range   : create_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}
