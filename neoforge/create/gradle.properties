## mic_rtsim_create: the Create plugin of the industry workstream (C15 to C19, INDUSTRY.md §12 layer 2)
mod_id          = mic_rtsim_create
mod_name        = MIC rtsim: Create
mod_version     = 0.1.0
mod_description = Create for mic-rtsim industry: station and train hooks, carriage cargo, postbox package contents, kinetic and belt merging, the District ledger display source

