## Gradle
org.gradle.jvmargs = -Xmx2G
org.gradle.daemon = true
org.gradle.parallel = true
org.gradle.caching = true

## Minecraft / NeoForge (the same pins as mods/mic-climate)
minecraft_version       = 1.21.1
minecraft_version_range = [1.21.1, 1.22)
neo_version             = 21.1.249
neo_version_range       = [21.1.249,)
loader_version_range    = [4,)

parchment_minecraft_version = 1.21.1
parchment_mappings_version  = 2024.11.17

## Shared by every mod project in this build
mod_group_id    = com.minecraftindustrialcomplex
mod_authors     = Benjamin McIntyre
# A2: the rtsim is AGPL-3.0. The repository's LICENSE is the FSF text.
mod_license     = AGPL-3.0-or-later

## Unit tests (pure Java: the boundary protocol, the journal and the stub engine)
junit_version = 5.11.3

## mic_native (the native host the Rust engine is a plugin of)
# The host's C ABI the plugin library is built for; natives.json carries it as format_version and
# mic_native refuses a different major version.
mic_native_abi = 1.0

## Plugins compile against the pack's own jars (verified versions, PLAN.md §1.3). The default is the
## MIC smoke server's mods folder next to this repository; override with -PpackMods=/path/to/mods.
packMods = ../../deep-time/smoke/mic/server/mods
ribbits_jar  = Ribbits-1.21.1-NeoForge-4.1.6.jar
yungsapi_jar = YungsApi-1.21.1-NeoForge-5.1.9.jar
geckolib_jar = geckolib-neoforge-1.21.1-4.9.3.jar
carryon_jar  = carryon-neoforge-1.21.1-2.2.6.13.jar
