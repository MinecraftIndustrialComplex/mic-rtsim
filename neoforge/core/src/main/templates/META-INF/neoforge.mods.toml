modLoader     = "javafml"
loaderVersion = "${loader_version_range}"
license       = "${mod_license}"

# Puppet safety: Entity.shouldBeSaved and Entity.saveAsPassenger (PLAN.md §6.1), plus accessors.
# defaultRequire 1: a mixin that no longer matches its target fails the launch.
[[mixins]]
config = "mic_rtsim.mixins.json"

[[mods]]
modId       = "${mod_id}"
version     = "${mod_version}"
displayName = "${mod_name}"
authors     = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId        = "minecraft"
    type         = "required"
    versionRange = "${minecraft_version_range}"
    ordering     = "NONE"
    side         = "BOTH"

[[dependencies.${mod_id}]]
    modId        = "neoforge"
    type         = "required"
    versionRange = "${neo_version_range}"
    ordering     = "NONE"
    side         = "BOTH"
