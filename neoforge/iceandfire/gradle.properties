## mic_rtsim_iceandfire: the Ice and Fire plugin (phase 2 dragons, PLAN.md §9, docs/boundary.md §6)
mod_id          = mic_rtsim_iceandfire
mod_name        = MIC rtsim: Ice and Fire
mod_version     = 0.1.0
mod_description = Ice and Fire for mic-rtsim: dragons as puppets of the engine's ecology (materialize, steer, depart, capture), their wounds, deaths, meals, lairs and robbed hoards, and every other dragon reported to the engine to adopt or discard

## The plugin compiles against the pack's own Ice and Fire CE jar and the libraries its classes name
## (verified with javap, docs/overnight-choices-iceandfire.md). Architectury is Uranus's runtime
## dependency only. The GameTest server runs with the pack's own Ice and Fire config.
iaf_jar          = iceandfire-2.1-beta.1.jar
iaf_uranus_jar   = uranus-2.4.1-1.21.1-neoforge.jar
iaf_jupiter_jar  = jupiter-2.3.7-1.21.1-neoforge.jar
iaf_geckolib_jar = geckolib-neoforge-1.21.1-4.9.3.jar
iaf_architectury_jar = architectury-13.0.11-neoforge.jar
# The pack's Ice and Fire config, relative to packMods (the smoke server's copy is byte-identical to
# pack/config, docs/overnight-choices-dragons.md).
iaf_config      = ../config/iceandfire/iaf-common.json

## In Control on the GameTest server for OG-10's danger A/B (OilDangerGameTests, -Pog10): the pack's own
## spawner.json and spawn.json (arm A) against the pack proposal's (arm B). The config is relative to packMods.
incontrol_jar    = incontrol-1.21-10.3.0.jar
incontrol_config = ../config/incontrol
