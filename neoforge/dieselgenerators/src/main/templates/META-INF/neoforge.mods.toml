modLoader     = "javafml"
loaderVersion = "${loader_version_range}"
license       = "${mod_license}"

# defaultRequire 1: a mixin that no longer matches its target fails the launch (PATCHES.md).
[[mixins]]
config = "mic_rtsim_dieselgenerators.mixins.json"

[[mods]]
modId       = "${mod_id}"
version     = "${mod_version}"
displayName = "${mod_name}"
authors     = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId        = "minecraft"
    type         = "required"
    versionRange = "${minecraft_version_range}"
    ordering     = "NONE"
    side         = "BOTH"

[[dependencies.${mod_id}]]
    modId        = "neoforge"
    type         = "required"
    versionRange = "${neo_version_range}"
    ordering     = "NONE"
    side         = "BOTH"

[[dependencies.${mod_id}]]
    modId        = "mic_rtsim"
    type         = "required"
    versionRange = "[0.1.0,)"
    ordering     = "AFTER"
    side         = "BOTH"

# The plugin is built around one mod (D4), verified with javap against the pack's jar.
[[dependencies.${mod_id}]]
    modId        = "createdieselgenerators"
    type         = "required"
    versionRange = "[1.3.15,1.4)"
    ordering     = "AFTER"
    side         = "BOTH"
