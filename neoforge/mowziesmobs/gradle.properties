## mic_rtsim_mowziesmobs: the Mowzie's Mobs plugin (MOWZIE.md §9, slice M5 on): the Frostmaw's den and the
## Umvuthana's grove as camps whose members at home are the jar's own bodies (the camp reconciler, §4.9)
mod_id          = mic_rtsim_mowziesmobs
mod_name        = MIC rtsim: Mowzie's Mobs
mod_version     = 0.1.0
mod_description = Mowzie's Mobs for mic-rtsim: the Frostmaw's den and the Umvuthana's grove as conflict camps, their bodies at home kept by the camp reconciler and their war parties played by the jar's own mobs

## The plugin compiles against the pack's own Mowzie's Mobs jar and GeckoLib (its entities extend GeckoLib's
## types). The GameTest server runs with the pack's own Mowzie's Mobs config. Paths are relative to packMods.
mowziesmobs_jar     = mowziesmobs-1.21.1-1.8.2.jar
mowzie_geckolib_jar = geckolib-neoforge-1.21.1-4.9.3.jar
mowzie_config       = ../config/mowziesmobs-common.toml
