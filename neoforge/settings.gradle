// The Java side of mic-rtsim: the core bridge mod `mic_rtsim` and, later, one Gradle project per
// plugin (`mic_rtsim_<mod>`, PLAN.md §1.3). Each project is its own jar and mod id (A1).
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'mic-rtsim-neoforge'

// The core bridge (mod id mic_rtsim). It depends on NeoForge only (D4).
include 'core'

// Plugins (PLAN.md §1.3): Java adapters and data for one mod each, compiled against that mod's jar
// (compileOnly) and loaded only where the mod is installed.
include 'ribbits'   // mic_rtsim_ribbits: Ribbits 4.1.6 (C7, C23)
include 'carryon'   // mic_rtsim_carryon: Carry On 2.2.6.13's EntityPickupEvent (A10, PLAN.md §6.2)
include 'create'    // mic_rtsim_create: Create 6.0.10, the industry plugin (INDUSTRY.md §12 layer 2)
include 'iceandfire' // mic_rtsim_iceandfire: Ice and Fire CE 2.1-beta.1, phase 2's dragons (PLAN.md §9)

// The industry plugins of overnight agent 14 (docs/overnight-choices-indplugins.md), each built around
// one mod and sharing ../plugin.gradle.
include 'oreexcavation'     // mic_rtsim_oreexcavation: Create Ore Excavation veins as finite deposits (I11)
include 'dieselgenerators'  // mic_rtsim_dieselgenerators: Diesel Generators chunk oil (I11)
include 'endertransmission' // mic_rtsim_endertransmission: channel buffers as shared stock (I13)
include 'powergrid'         // mic_rtsim_powergrid: batteries and power links (I13)
include 'destroy'           // mic_rtsim_destroy: pollution attribution (I14) and crude oil (I11)
include 'climate'           // mic_rtsim_climate: seasons and temperature (I12)
include 'radar'             // mic_rtsim_radar: radar turrets in the defence survey (I21)
