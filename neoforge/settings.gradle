// The Java side of mic-rtsim: the core bridge mod `mic_rtsim` and, later, one Gradle project per
// plugin (`mic_rtsim_<mod>`, PLAN.md §1.3). Each project is its own jar and mod id (A1).
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'mic-rtsim-neoforge'

// The core bridge (mod id mic_rtsim). It depends on NeoForge only (D4).
include 'core'

// Plugins (PLAN.md §1.3): Java adapters and data for one mod each, compiled against that mod's jar
// (compileOnly) and loaded only where the mod is installed.
include 'ribbits'   // mic_rtsim_ribbits: Ribbits 4.1.6 (C7, C23)
include 'carryon'   // mic_rtsim_carryon: Carry On 2.2.6.13's EntityPickupEvent (A10, PLAN.md §6.2)
