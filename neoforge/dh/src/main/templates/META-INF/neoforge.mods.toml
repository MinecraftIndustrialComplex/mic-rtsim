modLoader     = "javafml"
loaderVersion = "${loader_version_range}"
license       = "${mod_license}"

[[mods]]
modId       = "${mod_id}"
version     = "${mod_version}"
displayName = "${mod_name}"
authors     = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId        = "minecraft"
    type         = "required"
    versionRange = "${minecraft_version_range}"
    ordering     = "NONE"
    side         = "CLIENT"

[[dependencies.${mod_id}]]
    modId        = "neoforge"
    type         = "required"
    versionRange = "${neo_version_range}"
    ordering     = "NONE"
    side         = "CLIENT"

# The far-object registry it draws from (the core's client side).
[[dependencies.${mod_id}]]
    modId        = "mic_rtsim"
    type         = "required"
    versionRange = "[0.1.0,)"
    ordering     = "AFTER"
    side         = "CLIENT"

# Built around one mod (D4): Distant Horizons draws the boxes. Client only (research note §6.2).
[[dependencies.${mod_id}]]
    modId        = "distanthorizons"
    type         = "required"
    versionRange = "${dh_version_range}"
    ordering     = "AFTER"
    side         = "CLIENT"
